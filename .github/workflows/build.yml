name: Build

# Reusable workflow: builds and packages the app for every platform.
# Used by CI (go.yml) and by releases (release.yml), so both build the same way.
on:
  workflow_call:
    inputs:
      version:
        description: Version embedded into the app and the archive names, e.g. v1.2.3
        type: string
        default: dev

env:
  # Necessary for most environments as build failure can occur due to OOM issues
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    strategy:
      # Failure in one platform build won't impact the others
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            name: linux-amd64
            # Ubuntu 24.04 ships WebKitGTK 4.1 only
            tags: webkit2_41
          - os: windows-latest
            platform: windows/amd64
            name: windows-amd64
            tags: ''
          - os: macos-latest
            platform: darwin/universal
            name: macos-universal
            tags: ''

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # go.mod sets only the minimum version. Go 1.22 binaries have no LC_UUID and are refused by
      # current macOS; Go 1.25+ breaks binding generation of Wails CLI v2.12 ("package embed without
      # types"). Go 1.24 works for both and is the version the app is verified with locally.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Set product version
        run: node .github/scripts/set-version.mjs "${{ inputs.version }}"

      - name: Build
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          TAGS: ${{ matrix.tags }}
        run: |
          args=(-platform "${{ matrix.platform }}" -ldflags "-X github.com/bssth/civ4-studio/editor.Version=${VERSION}")
          if [ -n "$TAGS" ]; then
            args+=(-tags "$TAGS")
          fi
          wails build "${args[@]}"

      - name: Package
        shell: bash
        env:
          ARCHIVE: civ4studio-${{ inputs.version }}-${{ matrix.name }}
        run: |
          mkdir -p dist
          case "$RUNNER_OS" in
            Linux)   tar -czf "dist/$ARCHIVE.tar.gz" -C build/bin civ4studio ;;
            Windows) 7z a "dist/$ARCHIVE.zip" ./build/bin/civ4studio.exe ;;
            macOS)   ditto -c -k --keepParent build/bin/civ4studio.app "dist/$ARCHIVE.zip" ;;
          esac
          ls -l dist

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: civ4studio-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
